<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Montagem</title>
</head>
<body>
    <main>
        <header>
            <h1>Strider</h1>
            <p>Montagem de Pc</p>
        </header>

        <section id="imagemprincipal">
            <img src="https://shopinfo.com.br/cdn/shop/files/1_7fc9194a-4d6a-4170-b16f-1191d768cbcf.png?format=jpg&quality=70&v=1785374017&width=400" alt="">

            <div id="coluna">
                <h1>Monte seu Pc Gamer dos sonhos!</h1>

                <div class="pecas">
                    <h2>Placa Mãe</h2>
                    <div id="placam"></div>
                    <input type="button" value="+ Adicionar" id="placambutton">
                </div>

                <div class="pecas">
                    <h2>Processador</h2>
                    <div id="processador"></div>
                    <input type="button" value="+ Adicionar" id="processadorbutton">
                </div>

                <div class="pecas">
                    <h2>Memória RAM</h2>
                    <div id="memoriaram"></div>
                    <input type="button" value="+ Adicionar" id="memoriarambutton">
                </div>

                <div class="pecas">
                    <h2>Placa de Vídeo</h2>
                    <div id="placav"></div>
                    <input type="button" value="+ Adicionar" id="placavbutton">
                </div>

                <div class="pecas">
                    <h2>Armazenamento</h2>
                    <div id="armazenamento"></div>
                    <input type="button" value="+ Adicionar" id="armazenamentobutton">
                </div>

                <div class="pecas">
                    <h2>Fonte</h2>
                    <div id="fonte"></div>
                    <input type="button" value="+ Adicionar" id="fontebutton">
                </div>
                
                <div class="pecas">
                    <h2>Gabinete</h2>
                    <div id="gabinete"></div>
                    <input type="button" value="+ Adicionar" id="gabinetebutton">
                </div>


            <div id="divtotal">
                <h1>Total:</h1>
                <div id="total"></div>
            </div>
            </div>

            
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
